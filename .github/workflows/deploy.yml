name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WEB_PROJECT: src/SignalFromTheWoods.Web/SignalFromTheWoods.Web.csproj
  BASE_HREF: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/SignalFromTheWoods.Domain.Tests --configuration Release

      - name: Publish
        run: dotnet publish "$WEB_PROJECT" --configuration Release --output release

      - name: Set base href for GitHub Pages
        run: sed -i "s|<base href=\"/\" />|<base href=\"$BASE_HREF\" />|" release/wwwroot/index.html

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
